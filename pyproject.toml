[project]
name = "soc-transaction-anomaly-detector"
version = "2.0.0.dev0"
description = "Proof of concept for SOC-oriented financial transaction anomaly detection."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
]


[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]


[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]
ignore = []


[tool.ruff.lint.isort]
known-first-party = ["src"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true


[tool.bandit]
exclude_dirs = ["tests"]

[dependency-groups]
lint = [
    "ruff>=0.16.1",
]
security = [
    "bandit[toml]>=1.9.4",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]


markers = [
    "unit: testes unitários rápidos e isolados",
    "integration: testes de integração entre componentes do pipeline",
]
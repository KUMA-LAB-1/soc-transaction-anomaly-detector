name: CI

on:
  push:
    branches:
      - main
      - feature/devsecops
      - refactor/security-detector

  pull_request:
    branches:
      - main
      - feature/devsecops

jobs:
  quality:
    name: Quality + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group lint --group test --group security

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Bandit SAST
        run: uv run bandit -c pyproject.toml -r src

      - name: Dependency vulnerability audit
        run: uv run pip-audit

      - name: Run unit tests with coverage gate
        run: uv run pytest tests/unit

  integration:
    name: Integration Smoke
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group test

      - name: Run pipeline smoke test
        run: uv run pytest tests/integration/test_pipeline_smoke.py -v --no-cov